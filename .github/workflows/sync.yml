name: Sync football data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Refresh every competition (takes ~3 minutes)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Previous data, so competitions not refreshed in this run are kept.
      - name: Checkout existing data
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: public

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SYNC_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all && '1' || '0' }}
        run: node sync.mjs public

      # gh-pages always holds a single commit, so the repo never grows.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          if [ ! -d .git ]; then
            git init -q
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan snapshot
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin snapshot:gh-pages
